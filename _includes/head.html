<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
{% feed_meta %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/i.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FBPZHHM1PP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FBPZHHM1PP');
</script>
</head>
<body>
<div id="bump">
    <header class="site-header{% if include.dark %} darken{% endif %}">
      <div class="wrap">
        <div class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
        <button class="menu" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <nav id="site-nav" aria-label="Main">
          <ul>
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            {% for link in site.links %}
            <li><a href="{% if link.external %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if link.external %} target="_blank" rel="noopener"{% endif %}>{{ link.title }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </header>
