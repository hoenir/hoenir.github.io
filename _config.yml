title:            Sander Van de Cruys
tagline:          Don't panic.
description:      My corner of the internet
url:              https://sandervandecruys.be

# Owner/author information
owner:
  name:           Sander Van de Cruys
  avatar:         avatar.png
  bio:            "Professional Prutser"
  email:          sander.vandecruys@gmail.com
  github:         hoenir
  instagram:      sandvdc
  linkedin:       https://www.linkedin.com/in/sander-van-de-cruys-18b74431/
  dribbble:
  location:       "Ramsel, Belgium"

tools:
  standards:      "HTML, SCSS, Jekyll"
  software:       "git"

# Links to include in top navigation
# For external links add external: true
links:
  - title: About
    url: /about
  - title: Publications
    url: /publications
  - title: Substack
    url: https://www.thereisnoreward.com
    external: true
  - title: Moerstaal
    url: /moerstaal

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  posts_limit: 20

# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone:    Europe/Brussels
future:      true
# highlighter: pygments
markdown:    kramdown

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

sass:
    style: :compressed

# https://github.com/mojombo/jekyll/wiki/Permalinks
permalink:   /:categories/:title

include: [".htaccess"]
exclude: ["README.md", "LICENSE", "Gemfile", "Gemfile.lock", "vendor", "tools"]
