# Builds the site with the same builder GitHub Pages uses, without deploying.
# Runs on branches other than master and on pull requests; the built site is
# uploaded as an artifact so it can be downloaded and previewed.
name: Build check

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
